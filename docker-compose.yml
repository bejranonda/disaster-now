# Disaster Now on a server (docs/SERVER.md). The same pattern as FloodWatch's compose: the app listens on localhost
# only. Public traffic: the Cloudflare Worker serves the page from the edge and the collector uploads its files to KV
# (docs/CLOUDFLARE.md, recommended), or a tunnel made for this site (profile "public"), or the host's reverse proxy.
#   docker compose up -d --build                     web on http://127.0.0.1:8090/ + the collector every 15 min
#   docker compose --profile public up -d            also the tunnel (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
#   docker compose run --rm collector node tools/collect.mjs        one collector run now
#   docker compose exec web node tools/health.mjs --web http://127.0.0.1:8080/
name: disaster-now

services:
  web:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: disaster-now:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:8080"   # local only; on its own server (GUIDELINES §8)
    volumes:
      - live:/app/public/data/live:ro         # the collector's files, read only here
    read_only: true
    tmpfs: [/tmp]

  collector:
    build:                                     # the same image as web (cached: built once)
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: disaster-now:local
    restart: unless-stopped
    command: ["node", "tools/collect.mjs", "--every", "${COLLECT_EVERY:-900}"]
    environment:
      LIVE_DIR: /app/public/data/live
      PUBLIC_HOST: ${PUBLIC_HOST:-risk.autobahn.bot}     # the User-Agent names the site (GUIDELINES §5)
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      # GLM: English for TMD's warnings, off unless AI_ENABLED=1 (docs/AI.md)
      AI_ENABLED: ${AI_ENABLED:-0}
      AI_PROVIDER: ${AI_PROVIDER:-glm}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-glm-5.3-flash}
      GLM_ENDPOINT: ${GLM_ENDPOINT:-https://open.bigmodel.cn/api/paas/v4/chat/completions}
      AI_DAILY_CALLS: ${AI_DAILY_CALLS:-200}
      # Workers KV: the live files for the Cloudflare Worker, only when all three are set (docs/CLOUDFLARE.md).
      # Only the KV token is passed: give it "Workers KV Storage: Edit" and nothing else.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CF_KV_NAMESPACE_ID: ${CF_KV_NAMESPACE_ID:-}
      CF_KV_TOKEN: ${CF_KV_TOKEN:-}
    volumes:
      - live:/app/public/data/live
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "node", "tools/health.mjs", "--live", "/app/public/data/live", "--max-age", "2700"]
      interval: 5m
      timeout: 10s
      start_period: 3m
      retries: 2

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--url", "http://web:8080"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}   # from .env; the tunnel exits with an error without it
    depends_on: [web]
    profiles: ["public"]

volumes:
  live:
